name: Header cleanup

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  cleanup:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Simplify header
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<img class="fg-brand-mark" src="(LOGO)-(WEBSITE)-(FRAMEGATE_Ai)-Visual-ohne-text-20260409.png" alt="">', '')
          start = s.find('<nav class="fg-links">')
          if start != -1:
              end = s.find('</nav>', start)
              if end != -1:
                  s = s[:start] + s[end+6:]
          s = s.replace('background:rgba(255,255,255,.97);backdrop-filter:blur(10px);', 'background:#fff;')
          s = s.replace('min-height:86px;', 'min-height:78px;')
          s = s.replace('.fg-brand{display:flex;align-items:center;gap:11px;flex-shrink:0}', '.fg-brand{display:flex;align-items:center;flex-shrink:0}')
          s = s.replace('.fg-brand-mark{height:34px;width:auto;display:block}', '')
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit cleanup
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Simplify Framegate header"
          git push
